<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Assistant</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    #historyPanel {
      display: none;
      padding: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
    }

    #historyPanel h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #historyList {
      font-size: 14px;
      color: #555;
    }

    #historyButton {
      border: none;
      padding: 12px;
      background: #eef1f5;
      font-size: 15px;
      cursor: pointer;
    }

    .header {
      padding: 18px;
      background: #111827;
      color: white;
      text-align: center;
    }

    .header h2 {
      margin: 0;
      font-size: 21px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .header button {
      margin-top: 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      margin-left: auto;
      background: #111827;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      margin-right: auto;
      background: #eef1f5;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #userInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      font-size: 12px;
      color: #777;
      padding-bottom: 5px;
    }

  </style>
</head>

<body>

  <div class="app">

    <div id="historyPanel">
      <h3>Chat History</h3>
      <div id="historyList"></div>
    </div>

    <button id="historyButton" onclick="toggleHistory()">
      ☰ Chat History
    </button>

    <div class="header">
      <h2>🤖 My AI Assistant</h2>
      <p>Powered by AI</p>

      <button onclick="newChat()">
        ＋ New Chat
      </button>
    </div>

    <div id="chatMessages">

      <div class="message bot-message">
        🤖 Hello! Main aapka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte hain.
      </div>

    </div>

    <div id="status"></div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Message AI..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    const BACKEND_URL =
      "https://my-ai-chatbot-backend-gqfo.onrender.com";


    async function sendMessage() {

      const input =
        document.getElementById("userInput");

      const chat =
        document.getElementById("chatMessages");

      const button =
        document.getElementById("sendButton");

      const status =
        document.getElementById("status");

      const message =
        input.value.trim();


      if (message === "") {
        return;
      }


      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user-message";

      userMessage.textContent =
        message;

      chat.appendChild(userMessage);


      const historyList =
        document.getElementById("historyList");

      const historyItem =
        document.createElement("div");

      historyItem.textContent =
        message;

      historyItem.style.padding =
        "8px 0";

      historyItem.style.borderBottom =
        "1px solid #ddd";

      historyList.appendChild(historyItem);


      input.value = "";

      button.disabled = true;

      button.textContent = "...";

      status.textContent =
        "AI is thinking...";


      const botMessage =
        document.createElement("div");

      botMessage.className =
        "message bot-message";

      botMessage.textContent =
        "🤖 Soch raha hoon...";

      chat.appendChild(botMessage);

      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            BACKEND_URL + "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data.reply || "Server error"
          );
        }


        botMessage.textContent =
          "🤖 " +
          (data.reply ||
            "No answer received.");


      } catch (error) {

        console.error(error);

        botMessage.textContent =
          "🤖 Sorry, connection problem.";

      }


      button.disabled = false;

      button.textContent = "Send";

      status.textContent = "";

      chat.scrollTop =
        chat.scrollHeight;

    }


    function toggleHistory() {

      const panel =
        document.getElementById("historyPanel");

      if (
        panel.style.display === "none" ||
        panel.style.display === ""
      ) {

        panel.style.display =
          "block";

      } else {

        panel.style.display =
          "none";

      }

    }


    function newChat() {

      document.getElementById(
        "chatMessages"
      ).innerHTML =
        '<div class="message bot-message">🤖 Hello! Main aapka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte hain.</div>';

      document.getElementById(
        "userInput"
      ).value = "";

      document.getElementById(
        "status"
      ).textContent = "";

    }


    document
      .getElementById("userInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            sendMessage();
          }

        }
      );

  </script>

</body>
</html>
