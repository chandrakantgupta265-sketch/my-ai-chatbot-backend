<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      height: 100vh;
    }

    .app {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #111827;
      color: white;
      text-align: center;
    }

    .header h2 {
      margin: 0;
      font-size: 21px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .header button {
      margin-top: 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #111827;
      font-size: 14px;
    }

    #historyButton {
      width: 100%;
      padding: 10px;
      border: none;
      background: #e5e7eb;
      color: #111827;
      font-size: 14px;
    }

    #historyPanel {
      display: none;
      padding: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
    }

    #historyPanel h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #historyList {
      font-size: 14px;
      color: #555;
    }

    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      margin-left: auto;
      background: #111827;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      margin-right: auto;
      background: #eef1f5;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #userInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      font-size: 12px;
      color: #777;
      padding-bottom: 5px;
    }
  </style>
</head>

<body>

  <div class="app">

    <button id="historyButton" onclick="toggleHistory()">
      ☰ Chat History
    </button>

    <div id="historyPanel">
      <h3>Chat History</h3>
      <div id="historyList"></div>
    </div>

    <div class="header">
      <h2>🤖 My AI Assistant</h2>
      <p>Powered by AI</p>

      <button onclick="newChat()">
        ＋ New Chat
      </button>
    </div>

    <div id="chatMessages">

      <div class="message bot-message">
        🤖 Hello! Main aapka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte ho.
      </div>

    </div>

    <div id="status"></div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Message AI..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

  <script>
// @ts-nocheck

    const BACKEND_URL =
      "https://my-ai-chatbot-backend-gqfo.onrender.com";


    // Har chat ki alag ID
    let conversationId =
      localStorage.getItem("conversationId");

    if (!conversationId) {

      conversationId =
        createConversationId();

      localStorage.setItem(
        "conversationId",
        conversationId
      );

    }


    function createConversationId() {

      if (
        window.crypto &&
        crypto.randomUUID
      ) {
        return crypto.randomUUID();
      }

      return Date.now().toString() +
        Math.random().toString(36).slice(2);

    }


    async function sendMessage() {

      const input =
        document.getElementById("userInput");

      const chat =
        document.getElementById("chatMessages");

      const button =
        document.getElementById("sendButton");

      const status =
        document.getElementById("status");


      const message =
        input.value.trim();


      if (message === "") {
        return;
      }


      // User message
      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user-message";

      userMessage.textContent =
        message;

      chat.appendChild(userMessage);


      // History mein save
      saveHistory(message);


      input.value = "";

      button.disabled = true;

      button.textContent = "...";

      status.textContent =
        "AI is thinking...";


      // Bot message
      const botMessage =
        document.createElement("div");

      botMessage.className =
        "message bot-message";

      botMessage.textContent =
        "🤖 Soch raha hoon...";

      chat.appendChild(botMessage);

      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            BACKEND_URL + "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message,
                conversationId:
                  conversationId
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.reply ||
            "Server error"
          );

        }


        botMessage.textContent =
          "🤖 " +
          (
            data.reply ||
            "No answer received."
          );


      } catch (error) {

        console.error(error);

        botMessage.textContent =
          "🤖 Sorry, connection problem.";

      }


      button.disabled = false;

      button.textContent = "Send";

      status.textContent = "";

      chat.scrollTop =
        chat.scrollHeight;

    }


    function saveHistory(message) {

      let history =
        JSON.parse(
          localStorage.getItem("chatHistory") ||
          "[]"
        );


      history.push({
        conversationId:
          conversationId,

        message:
          message,

        time:
          new Date().toLocaleString()
      });


      localStorage.setItem(
        "chatHistory",
        JSON.stringify(history)
      );

    }


    function showHistory() {

      const historyList =
        document.getElementById("historyList");


      let history =
        JSON.parse(
          localStorage.getItem("chatHistory") ||
          "[]"
        );


      historyList.innerHTML = "";


      if (history.length === 0) {

        historyList.textContent =
          "Abhi koi chat history nahi hai.";

        return;

      }


      history
        .slice()
        .reverse()
        .forEach(function(/** @type {any} */ item) {

          const div =
            document.createElement("div");

          div.className =
            "history-item";

          div.textContent =
            item.message;

          historyList.appendChild(div);

        });

    }


    function toggleHistory() {

      const panel =
        document.getElementById("historyPanel");


      if (
        panel.style.display === "block"
      ) {

        panel.style.display = "none";

      } else {

        panel.style.display = "block";

        showHistory();

      }

    }


    async function newChat() {

      // Purani conversation ko backend se delete
      try {

        await fetch(
          BACKEND_URL + "/new-chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              conversationId:
                conversationId
            })
          }
        );

      } catch (error) {

        console.error(error);

      }


      // Nayi conversation ID
      conversationId =
        createConversationId();


      localStorage.setItem(
        "conversationId",
        conversationId
      );


      // Chat screen clear
      document.getElementById(
        "chatMessages"
      ).innerHTML =
        '<div class="message bot-message">' +
        '🤖 Hello! Main aapka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte ho.' +
        '</div>';


      document.getElementById(
        "userInput"
      ).value = "";


      document.getElementById(
        "status"
      ).textContent = "";

    }


    document
      .getElementById("userInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            sendMessage();

          }

        }
      );

  </script>

</body>
</html>
