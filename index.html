<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 5px 0 10px;
      font-size: 13px;
    }

    .new-chat-btn {
      background: white;
      color: #2563eb;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #historyButton {
      width: 100%;
      border: none;
      background: #f1f5f9;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    #historyPanel {
      display: none;
      padding: 15px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
    }

    #historyPanel h3 {
      margin-top: 0;
    }

    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    #chatMessages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-message {
      margin-left: auto;
      background: #dbeafe;
      text-align: right;
    }

    .bot-message {
      margin-right: auto;
      background: #f1f5f9;
    }

    #status {
      text-align: center;
      font-size: 13px;
      color: #666;
      min-height: 20px;
      padding: 3px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h2>🤖 My AI Assistant</h2>
      <p>Powered by AI</p>

      <button class="new-chat-btn" onclick="newChat()">
        ＋ New Chat
      </button>
    </div>

    <button id="historyButton" onclick="toggleHistory()">
      ☰ Chat History
    </button>

    <div id="historyPanel">
      <h3>Chat History</h3>
      <div id="historyList"></div>
    </div>

    <div id="chatMessages">

      <div class="message bot-message">
        🤖 Hello! Main aapka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte hain.
      </div>

    </div>

    <div id="status"></div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Message likhiye..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

  <script>

    const BACKEND_URL =
      "https://my-ai-chatbot-backend-gqfo.onrender.com";


    function toggleHistory() {

      const panel =
        document.getElementById("historyPanel");

      if (
        panel.style.display === "none" ||
        panel.style.display === ""
      ) {

        panel.style.display = "block";

      } else {

        panel.style.display = "none";

      }
    }


    function addToHistory(message) {

      const historyList =
        document.getElementById("historyList");

      const historyItem =
        document.createElement("div");

      historyItem.className = "history-item";

      historyItem.textContent = message;

      historyList.appendChild(historyItem);
    }


    function newChat() {

      document.getElementById("chatMessages").innerHTML =
        '<div class="message bot-message">' +
        '🤖 Hello! Main aapka AI Assistant hoon. ' +
        'Aap mujhse kuch bhi pooch sakte hain.' +
        '</div>';

      document.getElementById("userInput").value = "";

      document.getElementById("status").textContent = "";
    }


    async function sendMessage() {

      const input =
        document.getElementById("userInput");

      const message =
        input.value.trim();

      if (!message) {
        return;
      }


      const chat =
        document.getElementById("chatMessages");

      const status =
        document.getElementById("status");

      const sendButton =
        document.getElementById("sendButton");


      // User message

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user-message";

      userMessage.textContent =
        message;

      chat.appendChild(userMessage);


      // History

      addToHistory(message);


      // Clear input

      input.value = "";


      // Thinking

      status.textContent =
        "🤖 Soch raha hoon...";

      sendButton.disabled = true;


      try {

        const response =
          await fetch(
            BACKEND_URL + "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.reply || "Server error"
          );

        }


        // AI message

        const botMessage =
          document.createElement("div");

        botMessage.className =
          "message bot-message";

        botMessage.textContent =
          "🤖 " +
          (
            data.reply ||
            "No answer received."
          );

        chat.appendChild(botMessage);


        // Scroll down

        chat.scrollTop =
          chat.scrollHeight;


        status.textContent = "";


      } catch (error) {

        console.error(error);

        const errorMessage =
          document.createElement("div");

        errorMessage.className =
          "message bot-message";

        errorMessage.textContent =
          "❌ Connection problem. Please try again.";

        chat.appendChild(errorMessage);

        status.textContent = "";

      }


      sendButton.disabled = false;

      input.focus();

    }


    // Enter key se message send

    document
      .getElementById("userInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            sendMessage();

          }

        }
      );

  </script>

</body>
</html>
